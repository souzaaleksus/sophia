name: Testes

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Express
          MSSQL_SA_PASSWORD: Sophia#Testes2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Sophia#Testes2026' -C -b -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      DOTNET_NOLOGO: "1"
      SOPHIA_TESTES_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=Sophia#Testes2026;TrustServerCertificate=true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar
        run: dotnet restore Sophia.sln

      - name: Conferir a formatação do C#
        run: dotnet format Sophia.sln --verify-no-changes --no-restore

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Analisar o JavaScript
        run: |
          npm install --no-save --no-audit --no-fund eslint@9.17.0 @eslint/js@9.17.0 globals@15.14.0
          npx eslint --config eslint.config.mjs src/Sophia.Web/wwwroot/js

      - name: Compilar
        run: dotnet build Sophia.sln --no-restore -c Release

      - name: Instalar o navegador dos testes de tela
        run: pwsh tests/Sophia.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Testes de unidade e BDD
        run: |
          dotnet test tests/Sophia.Domain.Tests --no-build -c Release
          dotnet test tests/Sophia.Application.Tests --no-build -c Release
          dotnet test tests/Sophia.Specs --no-build -c Release

      - name: Instalar o sqlcmd
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
          echo /opt/mssql-tools18/bin >> "$GITHUB_PATH"

      - name: Testes de integração
        run: dotnet test tests/Sophia.Integration.Tests --no-build -c Release

      - name: Testes de tela
        run: dotnet test tests/Sophia.E2E --no-build -c Release

  docker:
    runs-on: ubuntu-latest

    env:
      SOPHIA_SENHA_DA_APLICACAO: Sophia#AplicacaoCI2026

    steps:
      - uses: actions/checkout@v4

      - name: Subir o Sophia pelo docker compose
        run: docker compose up -d --build

      - name: Esperar o site responder
        run: |
          for _ in $(seq 1 60); do
            if curl -fs -o /dev/null http://localhost:8080/; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Conferir o painel
        run: |
          test "$(curl -s -o painel.html -w '%{http_code}' http://localhost:8080/)" = "200"
          grep -q '<h1>Painel</h1>' painel.html

      - name: Conferir a carga de demonstração
        run: |
          curl -fsS -o vendas.html http://localhost:8080/Vendas
          grep -qE 'data-testid="contagem">[1-9]' vendas.html
          grep -o 'data-testid="contagem">[^<]*' vendas.html

      - name: Conferir as tabelas criadas no banco Sophia
        run: |
          tabelas="$(docker compose exec -T banco bash -c '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -h -1 -W -Q "SET NOCOUNT ON; SELECT STRING_AGG(name, N'"','"') WITHIN GROUP (ORDER BY name) FROM Sophia.sys.tables"' | tr -d '\r')"
          echo "Tabelas no banco Sophia: $tabelas"
          test "$tabelas" = "Clientes,Produtos,VendaItens,Vendas"

      - name: Conferir que a aplicação conecta com o usuário sophia_app
        run: |
          docker compose exec -T web printenv ConnectionStrings__Sophia | grep -q 'User Id=sophia_app;'

      - name: Conferir que o usuário sophia_app lê e grava mas não cria tabela
        run: |
          comoAplicacao() {
            docker compose exec -T -e SENHA="$SOPHIA_SENHA_DA_APLICACAO" banco bash -c \
              '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sophia_app -P "$SENHA" -C -b -d Sophia -Q "$0"' "$1"
          }
          comoAplicacao "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.Produtos;"
          comoAplicacao "SET NOCOUNT ON; BEGIN TRAN; UPDATE dbo.Produtos SET Nome = Nome; ROLLBACK;"
          if comoAplicacao "CREATE TABLE dbo.Intrusa (Id INT);"; then
            echo "O usuário sophia_app conseguiu criar tabela."
            exit 1
          fi

      - name: Registrar o estado dos serviços
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs

      - name: Derrubar o Sophia
        if: always()
        run: docker compose down -v
