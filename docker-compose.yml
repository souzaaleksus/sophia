services:
  banco:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    entrypoint: ["/opt/mssql/bin/sqlservr"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SOPHIA_SENHA_DO_BANCO:-Sophia#Vendas2026}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - dados-do-banco:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  criar-banco:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      banco:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${SOPHIA_SENHA_DO_BANCO:-Sophia#Vendas2026}
      SOPHIA_SENHA_DA_APLICACAO: ${SOPHIA_SENHA_DA_APLICACAO:-Sophia#Aplicacao2026}
      SOPHIA_DADOS_DE_DEMONSTRACAO: ${SOPHIA_DADOS_DE_DEMONSTRACAO:-sim}
    volumes:
      - ./database:/scripts:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        case "$$SOPHIA_SENHA_DA_APLICACAO" in
          *"'"*)
            echo "SOPHIA_SENHA_DA_APLICACAO não pode ter aspa simples ('): a aplicação recebe a senha entre aspas simples no texto de conexão. Escolha outra senha; nada foi alterado." >&2
            exit 1
            ;;
        esac
        sqlcmd() { /opt/mssql-tools18/bin/sqlcmd -S banco -U sa -P "$$MSSQL_SA_PASSWORD" -C -b "$$@"; }
        sqlcmd -i /scripts/create-database.sql
        sqlcmd -d Sophia -v SenhaDaAplicacao="$$SOPHIA_SENHA_DA_APLICACAO" -i /scripts/usuario-da-aplicacao.sql
        if [ "$$SOPHIA_DADOS_DE_DEMONSTRACAO" = "sim" ]; then
          sqlcmd -d Sophia -i /scripts/carga-de-demonstracao.sql
        fi
    restart: "no"

  web:
    build: .
    restart: unless-stopped
    depends_on:
      criar-banco:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Sophia: "Server=banco;Database=Sophia;User Id=sophia_app;Password='${SOPHIA_SENHA_DA_APLICACAO:-Sophia#Aplicacao2026}';TrustServerCertificate=true"
      Sophia__FusoHorario: America/Sao_Paulo
    ports:
      - "8080:8080"

volumes:
  dados-do-banco:
